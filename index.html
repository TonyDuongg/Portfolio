    <script>
      // Apply a saved preference before first paint; blocked storage is harmless.
      try {
        const savedTheme = localStorage.getItem("tonyd-theme");
        const theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
